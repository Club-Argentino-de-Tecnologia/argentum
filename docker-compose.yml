version: '3'
services:
  geth:
    image: ethereum/client-go:v1.10.11-stable
    container_name: argentum_node
    restart: always
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
      - "30303:30303/udp"
    volumes:
      - ./data:/data
      - ./config:/config
    command: >
      --datadir=/data
      --networkid=${CHAIN_ID}
      --http
      --http.addr=0.0.0.0
      --http.port=8545
      --http.corsdomain=*
      --http.vhosts=*
      --http.api=eth,net,web3,txpool,clique,admin,debug,miner,personal
      --ws
      --ws.addr=0.0.0.0
      --ws.port=8546
      --ws.origins=*
      --ws.api=eth,net,web3,txpool,clique,admin,debug,miner,personal
      --syncmode=full
      --nat=extip:${NODE_IP}
      --bootnodes=${BOOTNODE}
      --mine
      --miner.etherbase=${ETHERBASE:-0xc51A179f7000D89e3D4d7C0000C991ffdcb57cB8}
      --miner.gasprice=1
      --unlock=${ETHERBASE:-0xc51A179f7000D89e3D4d7C0000C991ffdcb57cB8}
      --password=/config/password.txt
      --allow-insecure-unlock
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "10"